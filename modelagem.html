
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabinete Gamer 3D</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #10131c;
  font-family: Arial, sans-serif;
}

#info {
  position: absolute;
  top: 20px;
  left: 20px;
  color: white;
  z-index: 2;
  pointer-events: none;
}

canvas {
  display: block;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="info">
  <h2>GABINETE GAMER 3D</h2>
  <p>Arraste para girar | Scroll para zoom</p>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from
'three/addons/controls/OrbitControls.js';

// CENA
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10131c);

// CAMERA
const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);

camera.position.set(6, 3.5, 7);

// RENDERIZADOR
const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);

// CONTROLE DE MOVIMENTAÇÃO
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 3;
controls.maxDistance = 14;
controls.target.set(0, 2, 0);

// LUZES
scene.add(new THREE.AmbientLight(0xffffff, 1.5));

const light = new THREE.DirectionalLight(0xffffff, 3);
light.position.set(5, 8, 6);
scene.add(light);

// MATERIAIS
const black = new THREE.MeshStandardMaterial({
  color: 0x17191f,
  metalness: 0.65,
  roughness: 0.35
});

const glass = new THREE.MeshPhysicalMaterial({
  color: 0x8faac4,
  transparent: true,
  opacity: 0.13,
  roughness: 0.1,
  metalness: 0.2,
  side: THREE.DoubleSide,
  depthWrite: false
});

// FUNÇÃO PARA CRIAR PEÇAS
function box(w, h, d, x, y, z, material) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    material
  );

  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);

  return mesh;
}

// ESTRUTURA DO GABINETE
box(2.4, 4, 2, 0, 2, 0, black);

// BASE E TOPO
box(2.5, 0.12, 2.1, 0, 0.05, 0, black);
box(2.5, 0.12, 2.1, 0, 4.05, 0, black);

// VIDRO LATERAL
box(0.025, 3.75, 1.85, 1.22, 2, 0, glass);

// PLACA-MÃE
box(0.08, 3.3, 1.55, 0.92, 2, -0.05,
  new THREE.MeshStandardMaterial({color: 0x202b3d})
);

// PLACA DE VÍDEO
box(0.42, 0.35, 1.3, 0.55, 1.55, 0.05,
  new THREE.MeshStandardMaterial({
    color: 0x252a32,
    metalness: 0.7
  })
);

// MEMÓRIAS RAM
for (let i = 0; i < 2; i++) {
  box(0.12, 0.85, 0.12, 0.7, 2.8, -0.2 + i * 0.3,
    new THREE.MeshStandardMaterial({color: 0x555b68})
  );
}

// COOLERS RGB
function fan(x, y, z, side = false) {

  const color = new THREE.Color()
    .setHSL(Math.random(), 1, 0.55);

  const rgb = new THREE.MeshBasicMaterial({
    color: color
  });

  const dark = new THREE.MeshStandardMaterial({
    color: 0x080a10
  });

  const group = new THREE.Group();

  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(0.42, 0.055, 12, 48),
    rgb
  );

  const center = new THREE.Mesh(
    new THREE.CylinderGeometry(0.13, 0.13, 0.08, 32),
    dark
  );

  group.add(ring);
  group.add(center);

  // Orientação do cooler
  if (side) {
    group.rotation.y = Math.PI / 2;
  }

  group.position.set(x, y, z);
  scene.add(group);
}

// TRÊS COOLERS FRONTAIS
for (let i = 0; i < 3; i++) {
  fan(-0.65, 0.9 + i * 1.15, 1.04);
}

// COOLERS INTERNOS LATERAIS
for (let i = 0; i < 2; i++) {
  fan(0.98, 1.4 + i * 1.1, -0.55, true);
}

// PAINEL FRONTAL
box(2.35, 4, 0.08, 0, 2, 1.06,
  new THREE.MeshStandardMaterial({
    color: 0x11151c,
    metalness: 0.5
  })
);

// ABERTURA FRONTAL SIMPLIFICADA
box(1.85, 3.85, 0.025, 0, 2, 1.115,
  new THREE.MeshStandardMaterial({
    color: 0x090b10
  })
);

// REPOSICIONAR OS COOLERS À FRENTE DO PAINEL
// PISO
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({color: 0x171a24})
);

floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.12;
scene.add(floor);

// ANIMAÇÃO
function animate() {
  requestAnimationFrame(animate);

  controls.update();
  renderer.render(scene, camera);
}

animate();

// RESPONSIVIDADE
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
});
</script>

</body>
</html>
