
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabinete Panorâmico 3D</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  background: #17191d;
  font-family: Arial, sans-serif;
}

#painel {
  position: absolute;
  top: 20px;
  left: 20px;
  color: white;
  z-index: 2;
  background: #202329dd;
  padding: 15px 20px;
  border-radius: 10px;
}

#painel h3 { margin: 0 0 8px; }
#painel p { font-size: 12px; color: #bbb; }

button {
  background: #343942;
  color: white;
  border: 0;
  padding: 9px 12px;
  border-radius: 5px;
  cursor: pointer;
  margin: 3px;
}
button:hover { background: #555e6b; }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="painel">
  <h3>GABINETE GAMER</h3>
  <p>Arraste para girar em 360°</p>
  <p>Scroll para aproximar</p>
  <button onclick="window.viewFront()">Frente</button>
  <button onclick="window.viewSide()">Lateral</button>
  <button onclick="window.viewBack()">Traseira</button>
  <button onclick="window.viewDefault()">360°</button>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from
'three/addons/controls/OrbitControls.js';

// CENA
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17191d);

// CÂMERA
const camera = new THREE.PerspectiveCamera(
  40, window.innerWidth / window.innerHeight, 0.1, 100
);
camera.position.set(6, 4, 7);

// RENDER
const renderer = new THREE.WebGLRenderer({
  antialias: true
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

// CONTROLES
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 2, 0);
controls.minDistance = 3;
controls.maxDistance = 13;

// LUZES
scene.add(new THREE.AmbientLight(0xffffff, 1.4));

const luz = new THREE.DirectionalLight(0xffffff, 3);
luz.position.set(5, 8, 6);
luz.castShadow = true;
scene.add(luz);

const luzAmbiente = new THREE.PointLight(0xffffff, 20, 15);
luzAmbiente.position.set(-3, 4, 4);
scene.add(luzAmbiente);

// MATERIAIS
const preto = new THREE.MeshStandardMaterial({
  color: 0x101114,
  metalness: 0.7,
  roughness: 0.3
});

const metal = new THREE.MeshStandardMaterial({
  color: 0x282a2e,
  metalness: 0.8,
  roughness: 0.35
});

const vidro = new THREE.MeshPhysicalMaterial({
  color: 0x87919b,
  transparent: true,
  opacity: 0.12,
  roughness: 0.08,
  metalness: 0.15,
  side: THREE.DoubleSide,
  depthWrite: false
});

const escuro = new THREE.MeshStandardMaterial({
  color: 0x070809,
  roughness: 0.6
});

// FUNÇÃO PARA CRIAR PEÇAS
function criarCaixa(w,h,d,x,y,z,material) {
  const obj = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    material
  );
  obj.position.set(x,y,z);
  obj.castShadow = true;
  obj.receiveShadow = true;
  scene.add(obj);
  return obj;
}

// ESTRUTURA PRINCIPAL
const gabinete = new THREE.Group();
scene.add(gabinete);

function peca(w,h,d,x,y,z,material=preto) {
  const obj = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d), material
  );
  obj.position.set(x,y,z);
  obj.castShadow = true;
  obj.receiveShadow = true;
  gabinete.add(obj);
  return obj;
}

// Dimensões aproximadas: 3.2 x 4.2 x 2.4

// Base e teto
peca(3.2,0.16,2.4,0,0.08,0);
peca(3.2,0.16,2.4,0,4.12,0);

// Colunas estruturais
peca(0.12,4,0.12,-1.54,2,1.14);
peca(0.12,4,0.12,1.54,2,1.14);
peca(0.12,4,0.12,-1.54,2,-1.14);
peca(0.12,4,0.12,1.54,2,-1.14);

// VIDRO LATERAL
const lateral = new THREE.Mesh(
  new THREE.BoxGeometry(0.025,3.8,2.15),
  vidro
);
lateral.position.set(1.59,2,0);
gabinete.add(lateral);

// VIDRO FRONTAL
const frontal = new THREE.Mesh(
  new THREE.BoxGeometry(3.0,3.8,0.025),
  vidro
);
frontal.position.set(0,2,1.22);
gabinete.add(frontal);

// PAINEL TRASEIRO
peca(0.08,3.85,2.25,-1.55,2,0,metal);

// PLACA-MÃE
peca(0.10,3.1,1.75,-1.35,2,0,escuro);

// ÁREA DA PLACA-MÃE
peca(0.04,2.7,1.45,-1.27,2,0,
  new THREE.MeshStandardMaterial({
    color:0x171a20,
    metalness:0.5
  })
);

// ABERTURA TRASEIRA DA PLACA-MÃE
peca(0.04,1.0,0.55,-1.22,2.4,-0.1,preto);

// PLACA DE VÍDEO
peca(0.32,0.38,1.45,-0.55,1.35,0,
  new THREE.MeshStandardMaterial({
    color:0x17191d,
    metalness:0.7,
    roughness:0.3
  })
);

// DETALHE DA GPU
peca(0.04,0.23,1.1,-0.35,1.35,0,metal);

// MEMÓRIAS RAM
for(let i=0;i<2;i++){
  peca(0.10,0.85,0.13,-1.15,2.9,-0.45+i*0.3,metal);
}

// COOLERS
function criarCooler(x,y,z,rotacao=0) {
  const cooler = new THREE.Group();

  const aro = new THREE.Mesh(
    new THREE.TorusGeometry(0.43,0.035,12,48),
    metal
  );
  cooler.add(aro);

  const centro = new THREE.Mesh(
    new THREE.CylinderGeometry(0.14,0.14,0.09,32),
    preto
  );
  centro.rotation.x = Math.PI/2;
  cooler.add(centro);

  // Sete pás curvas
  const materialPas = new THREE.MeshStandardMaterial({
    color:0x55585d,
    metalness:0.5,
    roughness:0.4,
    side:THREE.DoubleSide
  });

  for(let i=0;i<7;i++){
    const forma = new THREE.Shape();
    forma.moveTo(0.12,0.03);
    forma.quadraticCurveTo(0.34,0.05,0.36,0.23);
    forma.quadraticCurveTo(0.28,0.32,0.13,0.19);
    forma.lineTo(0.12,0.03);

    const geometria = new THREE.ShapeGeometry(forma);
    const pa = new THREE.Mesh(geometria,materialPas);
    pa.rotation.z = i * Math.PI*2/7;
    cooler.add(pa);
  }

  cooler.position.set(x,y,z);
  cooler.rotation.y = rotacao;
  gabinete.add(cooler);

  return cooler;
}

// DOIS COOLERS LATERAIS
criarCooler(1.40,2.9,-0.15,Math.PI/2);
criarCooler(1.40,1.7,-0.15,Math.PI/2);

// SUPORTE DOS COOLERS
peca(0.06,3.0,1.05,1.34,2.3,-0.15,metal);

// DETALHES DE VENTILAÇÃO
for(let i=0;i<8;i++){
  peca(0.025,0.035,0.9,-1.45,0.4+i*0.13,0,metal);
}

// PÉS DO GABINETE
for(let x of [-1.25,1.25]){
  for(let z of [-0.85,0.85]){
    peca(0.45,0.35,0.45,x,-0.17,z,preto);
  }
}

// PARAFUSOS DO VIDRO
function parafuso(x,y,z){
  const obj = new THREE.Mesh(
    new THREE.CylinderGeometry(0.055,0.055,0.035,24),
    metal
  );
  obj.rotation.z = Math.PI/2;
  obj.position.set(x,y,z);
  gabinete.add(obj);
}

parafuso(1.62,3.85,0.9);
parafuso(1.62,0.15,0.9);
parafuso(1.62,3.85,-0.9);
parafuso(1.62,0.15,-0.9);

// PISO
const piso = new THREE.Mesh(
  new THREE.PlaneGeometry(200,200),
  new THREE.MeshStandardMaterial({
    color:0x24262a,
    roughness:0.8
  })
);
piso.rotation.x=-Math.PI/2;
piso.position.y=-0.38;
scene.add(piso);

// VISTAS PRÉ-DEFINIDAS
function mudarVista(x,y,z){
  camera.position.set(x,y,z);
  controls.target.set(0,2,0);
}

window.viewFront = () => mudarVista(0,3,9);
window.viewSide = () => mudarVista(9,3,0);
window.viewBack = () => mudarVista(0,3,-9);
window.viewDefault = () => mudarVista(6,4,7);

// ANIMAÇÃO
function animar(){
  requestAnimationFrame(animar);
  controls.update();
  renderer.render(scene,camera);
}
animar();

// REDIMENSIONAMENTO
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
